name: Image Captioning MLOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  MLOPS_DATASET: flickr8k
  MINIO_ENDPOINT: 127.0.0.1:9000
  MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
  MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  MINIO_SECURE: "false"
  MLFLOW_TRACKING_URI: http://127.0.0.1:5000
  POSTGRES_DSN: postgresql://mlops:mlops@127.0.0.1:5432/mlops

jobs:
  mlops-pipeline:
    name: Run MLOps Pipeline
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check runner
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          python3 --version
          git --version
          dvc --version || true

      - name: Setup Python environment
        run: |
          set -euo pipefail
          rm -rf venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          if [[ -f requirements.txt ]]; then
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Check MinIO
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            http://127.0.0.1:9000/minio/health/live

      - name: Start pipeline services
        run: |
          set -euo pipefail
          docker compose up -d postgres mlflow
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U mlops -d mlops >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
              break
            fi
            sleep 2
          done
          if ! curl --fail --silent http://127.0.0.1:5000/health >/dev/null; then
            echo "MLflow did not become ready"
            docker compose logs postgres mlflow
            exit 1
          fi

      - name: Configure DVC
        run: |
          set -euo pipefail
          source venv/bin/activate
          dvc remote add -f minio s3://image-captioning/dvc-store
          dvc remote modify --local minio endpointurl http://127.0.0.1:9000
          dvc remote modify --local minio access_key_id "$MINIO_ACCESS_KEY"
          dvc remote modify --local minio secret_access_key "$MINIO_SECRET_KEY"

      - name: DVC pull
        run: |
          set -euo pipefail
          source venv/bin/activate
          dvc pull --remote minio

      - name: Verify dataset metadata
        run: |
          set -euo pipefail
          source venv/bin/activate
          python - <<'PY'
          import os
          import psycopg2

          with psycopg2.connect(os.environ["POSTGRES_DSN"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(
                      "SELECT COUNT(*) FROM dataset_metadata WHERE dataset_name = %s",
                      (os.environ["MLOPS_DATASET"],),
                  )
                  count = cursor.fetchone()[0]

          if count == 0:
              raise SystemExit(
                  f"No dataset_metadata rows found for {os.environ['MLOPS_DATASET']}"
              )
          print(f"Found {count} metadata rows")
          PY

      - name: Train model
        run: |
          set -euo pipefail
          source venv/bin/activate
          python src/train.py --dataset "$MLOPS_DATASET" 2>&1 | tee train.log
          run_id=$(sed -n 's/.*run_id=\([^ ]*\).*/\1/p' train.log | tail -n 1)
          if [[ -z "$run_id" ]]; then
            echo "Training completed without emitting an MLflow run ID"
            exit 1
          fi
          echo "MLFLOW_RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Evaluate model
        run: |
          set -euo pipefail
          source venv/bin/activate
          python src/evaluate.py --run-id "$MLFLOW_RUN_ID" --dataset "$MLOPS_DATASET"

      - name: Show artifacts
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './venv' -prune -o \
            -type f \
            \( -name '*.pt' -o -name '*.pth' -o -name '*.pkl' -o -name '*.json' \) \
            -print

      - name: Pipeline completed
        run: |
          echo "MLOps pipeline completed successfully on $(hostname)"